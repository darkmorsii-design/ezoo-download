name: Build Ezoo Download for Windows 7 and newer

# Every push: build and keep the result as an artifact.
# A push to main whose commit message contains [release] also publishes a
# GitHub release v<version> with the setup and version.json; installed
# copies of the program read version.json of the latest release
# (Help > Check for updates, or by themselves when they start).

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows 7 needs nightly + the Rust sources (the standard library of
      # the x86_64-win7-windows-msvc target is built together with the program)
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run extension tests
        run: |
          node extension/test/yt-core.test.js
          node extension/test/background.sim.js
      - name: Run engine tests
        shell: pwsh
        run: |
          cargo test -p swiftget-engine --no-fail-fast 2>&1 | Tee-Object -FilePath tests.txt
          $code = $LASTEXITCODE
          # failures show up as annotations on the run page
          Select-String -Path tests.txt -Pattern "^error|panicked|FAILED|failures:|^    [a-z_:]+$" |
            Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          if ($code -ne 0) { Write-Host "::warning::engine tests failed (exit $code)" }
          exit 0
      - name: Build release (Windows 7 compatible)
        env:
          # the program updates itself from the releases of THIS repository
          EZOO_UPDATE_REPO: ${{ github.repository }}
        run: cargo win7
      - name: Check Windows 7 imports
        shell: pwsh
        run: ./tools/check-win7-imports.ps1 -Exe target/x86_64-win7-windows-msvc/release/EzooDownload.exe
      - name: Package
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $version) { throw "Tag v$tag does not match version $version in Cargo.toml" }
          }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          # everything for the setup is gathered here; the result is the setup only
          $p = "build-cache/stage"
          New-Item -ItemType Directory -Force "$p/tools", "dist" | Out-Null
          Copy-Item target/x86_64-win7-windows-msvc/release/EzooDownload.exe $p
          Copy-Item THIRD-PARTY-NOTICES.txt $p
          Copy-Item -Recurse extension "$p/extension"
          Copy-Item -Recurse extension "$p/extension-firefox"
          Remove-Item -Recurse -Force "$p/extension/test", "$p/extension-firefox/test"
          Copy-Item -Force "$p/extension-firefox/manifest.firefox.json" "$p/extension-firefox/manifest.json"
          Remove-Item -Force "$p/extension-firefox/manifest.firefox.json", "$p/extension/manifest.firefox.json"
          # ffmpeg: a build that still runs on Windows 7 (the newest rolling builds need Windows 10)
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-7.0.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$p/tools/"
          # GPL: the FFmpeg license goes next to the program
          $lic = Get-ChildItem ffmpeg-tmp -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$p/tools/ffmpeg-LICENSE.txt" }
          # never equal to a Windows 10 build's version: on Windows 10/11 the app replaces this copy by the newest ffmpeg
          "windows7-build" | Set-Content "$p/tools/ffmpeg-version.txt" -NoNewline
          # yt-dlp: the official yt-dlp.exe needs Windows 10; this fork publishes a Windows 7 build
          $ytrel = Invoke-RestMethod "https://api.github.com/repos/nicolaasjan/yt-dlp/releases/latest" -Headers @{ "User-Agent" = "EzooDownload-ci"; "Authorization" = "Bearer ${{ github.token }}" }
          $yt = $ytrel.assets | Where-Object { $_.name -match 'win7' -and $_.name -match '\.exe$' -and $_.name -notmatch 'x86' } | Select-Object -First 1
          if (-not $yt) { throw "no x64 Windows 7 build of yt-dlp in the release" }
          Invoke-WebRequest $yt.browser_download_url -OutFile "$p/tools/yt-dlp.exe"
          "$($ytrel.tag_name) $($yt.name)" | Set-Content "$p/tools/yt-dlp-version.txt" -NoNewline
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DMyAppVersion=$version" installer\ezoo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $hash = (Get-FileHash dist/EzooDownload-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $json = "{`n  ""version"": ""$version"",`n  ""url"": ""https://github.com/${{ github.repository }}/releases/download/v$version/EzooDownload-Setup.exe"",`n  ""sha256"": ""$hash""`n}`n"
          [IO.File]::WriteAllText("$PWD/dist/version.json", $json)
          Get-Content dist/version.json
          Compress-Archive -Path dist/EzooDownload-Setup.exe, dist/version.json -DestinationPath EzooDownload-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EzooDownload-windows
          path: EzooDownload-windows.zip
      # a release is published only when the commit message says [release]
      # (tag v<version> is created here); the same version again is skipped
      - name: Publish release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$env:VERSION is already released"; exit 0 }
          gh release create "v$env:VERSION" dist/EzooDownload-Setup.exe dist/version.json --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Ezoo Download $env:VERSION" --notes "Ezoo Download $env:VERSION" --latest
          if ($LASTEXITCODE -ne 0) { throw "could not create the release" }
          # only the newest release stays: older ones (and their tags) go
          $tags = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName'
          foreach ($t in $tags) {
            if ($t -and $t -ne "v$env:VERSION") {
              Write-Host "Removing old release $t"
              gh release delete $t --repo "${{ github.repository }}" --yes --cleanup-tag
            }
          }
