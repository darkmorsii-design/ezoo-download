[package]
name = "swiftget"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ezoo Download – download manager (desktop app)"
build = "build.rs"

[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Slint 1.8 is pinned on purpose (newer ones are not checked on Windows 7).
# "accessibility" (screen-reader support through UI Automation) is switched
# off: it links Windows 8/10-only functions that stop the program from starting
# on Windows 7. Everything else stays: FemtoVG (OpenGL) renderer first,
# software renderer as the fallback when the graphics driver has no OpenGL.
slint = { version = "=1.8.0", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2"] }
tiny_http = "0.12"
arboard = { version = "3", default-features = false }
rfd = "0.15"
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
tokio-util = "0.7"
sys-locale = "0.3"

[build-dependencies]
slint-build = "=1.8.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "EzooDownload"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media_Audio"] }
