[package]
name = "swiftget"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ezoo Download – download manager (desktop app)"
build = "build.rs"

[dependencies]
swiftget-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Same as the original project (newest Slint 1.x: the UI code uses its newer
# translation API). Whether Slint's Windows 10-only accessibility code breaks
# Windows 7 is checked after the build by tools/check-win7-imports.ps1.
slint = "1.8"
tiny_http = "0.12"
arboard = { version = "3", default-features = false }
rfd = "0.15"
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
tokio-util = "0.7"
sys-locale = "0.3"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "EzooDownload"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media_Audio"] }

# Windows 7 target fix: windows-targets 0.48.5 (pulled in by an older
# dependency) only fetches its import library for the exact target name
# "x86_64-pc-windows-msvc", not for "x86_64-win7-windows-msvc", so linking failed
# with LNK1181 "cannot open windows.0.48.5.lib". Naming the crate here makes
# Cargo build it for every msvc target and add its lib folder to the linker path.
[target.'cfg(all(windows, target_arch = "x86_64", target_env = "msvc"))'.dependencies]
windows_x86_64_msvc = "=0.48.5"

[target.'cfg(all(windows, target_arch = "x86", target_env = "msvc"))'.dependencies]
windows_i686_msvc = "=0.48.5"
