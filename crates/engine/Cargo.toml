[package]
name = "swiftget-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download engine: multi-connection segmented downloads, resume, HLS, queue and scheduler"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
# TLS is done by rustls (+ the built-in Mozilla root certificates) instead of
# Windows' SChannel: on Windows 7 SChannel often negotiates only TLS 1.0 and its
# list of root certificates is outdated, so https://github.com and most
# download sites fail. The system proxy settings are still read by reqwest.
# (HTTP/2 is not needed: the engine uses HTTP/1.1 on purpose, see http.rs.)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
# unpacking the ffmpeg zip without Windows' tar.exe (it does not exist on Windows 7)
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
url = "2"
percent-encoding = "2"
aes = "0.8"
cbc = "0.1"
regex = "1"
filetime = "0.2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
